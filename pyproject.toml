[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moreno-jev"
version = "0.1.0"
description = "A cross-platform stdio MCP server and review skill for TypeSafe Jev."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp==1.26.0"]

[project.scripts]
moreno-jev = "jev_mcp:main"

[tool.setuptools]
py-modules = ["jev_mcp"]
